---
# Non-secret configuration. Safe to commit.
# Secret values live in vault.yml (encrypted) and are referenced from here.

# The account these playbooks configure: installs land in this user's home,
# and this user is the one added to the docker group.
#
# Resolved on the machine running ansible, so it is correct whether you run
# ./run.sh directly or under sudo. Do NOT use ansible_user_id here: the
# become: true plays gather facts as root and would resolve to "root".
# Override by replacing the whole expression with a literal username.
target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

# Home directory of target_user. Left undefined on purpose: playbook-preflight
# looks it up with getent so non-standard homes work. Set it here to override.
# target_user_home: /home/someone

# --- Secrets -----------------------------------------------------------------
# Each maps a friendly name onto a vault_* value. The default('') fallback
# makes vault.yml optional: without it these are empty strings rather than
# undefined-variable errors, so a fresh clone still runs.
# Only needed for private repositories given as https:// URLs. The defaults
# below use ssh URLs, which authenticate with the ssh key instead.
github_token: "{{ vault_github_token | default('') }}"
anthropic_api_key: "{{ vault_anthropic_api_key | default('') }}"
openai_api_key: "{{ vault_openai_api_key | default('') }}"
huggingface_token: "{{ vault_huggingface_token | default('') }}"
wandb_api_key: "{{ vault_wandb_api_key | default('') }}"
pypi_token: "{{ vault_pypi_token | default('') }}"
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"

# Global git identity. Vaulted because an email address is personal data that
# should not sit in a repository meant to be shared. Either left empty leaves
# the corresponding git setting untouched.
git_user_name: "{{ vault_git_user_name | default('') }}"
git_user_email: "{{ vault_git_user_email | default('') }}"

# Private ssh key for GitHub: it authenticates the private-repository clones
# and signs commits. Optional: when empty, playbook-github generates a
# passphrase-less ed25519 key on the machine and prints it for you to
# register. Vault it to keep one identity across machines, so a single key
# registered on GitHub serves them all. The public half is derived from it.
ssh_private_key: "{{ vault_ssh_private_key | default('') }}"

# Where that key lives on the machine.
ssh_key_path: "{{ target_user_home }}/.ssh/id_ed25519"

# Signs every commit and tag with an ssh key, matching git's gpg.format=ssh.
# Set enabled: false to leave git's signing settings alone.
git_signing:
  enabled: true
  key_path: "{{ ssh_key_path }}"

# --- Shell configuration ------------------------------------------------------
# The repository holding your shell profiles. Point this at your own fork.
# An ssh URL is cloned with the ssh key from playbook-github and is skipped
# until GitHub accepts that key. An https URL of a private repository is
# cloned with github_token instead. Set url to "" to skip playbook-shell.
configs_repo:
  url: "git@github.com:shawonashraf/configs.git"
  version: main
  dest: "{{ target_user_home }}/Projects/configs"
  # Selects shell/zshrc-<profile> from that repository. Deliberately "fedora"
  # on Ubuntu too: the repository has no zshrc-ubuntu, and the fedora profile
  # is distro-agnostic enough to reuse. setup.sh only uses the value to pick
  # that file and to word its hint messages, nothing OS-specific runs from it.
  profile: fedora

# Credentials the shell profile expects in the environment. These are written
# to ~/.secrets.env (mode 0600) and the matching "export NAME=" lines are
# stripped from the installed ~/.zshrc, so tokens never sit in a tracked file.
# Add entries freely: the key is the variable name the shell sees.
shell_secrets:
  WANDB_API_KEY: "{{ wandb_api_key }}"
  HF_TOKEN: "{{ huggingface_token }}"
  PYPI_TOKEN: "{{ pypi_token }}"

# --- Claude Code settings sync ------------------------------------------------
# https://github.com/shawonashraf/claude-code-sync backs up skills, hooks,
# agents, keybindings and a redacted settings.json to a git repository.
# Point backup_repo at your own; set it to "" to skip. An ssh URL uses the
# ssh key from playbook-github, so this is skipped until GitHub accepts it.
# A private https URL goes through github_token via the git credential store.
claude_sync:
  backup_repo: "git@github.com:shawonashraf/claude-code-backup.git"
  dest: "{{ target_user_home }}/Tools/claude-code-backup"
  # Installs the SessionEnd hook so every Claude Code session backs up on exit.
  install_hook: true

# shell-sync commits and pushes ~/.zshrc automatically. Left off because that
# would push any credential pasted into a live shell without review.
configs_shell_sync: false

# --- Private repositories to restore -----------------------------------------
# Repos cloned onto a fresh machine. dest is expanded relative to target_user's
# home. Set "private: true" for repos that need github_token to clone.
private_repos: []
# private_repos:
