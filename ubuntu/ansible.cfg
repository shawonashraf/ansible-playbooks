[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
# Readable multi-line task output. Do not use "stdout_callback = yaml":
# that callback was removed in community.general 12.
result_format = yaml
# Ubuntu 25.10+ ships sudo-rs, whose password prompt the builtin sudo plugin
# does not recognise. become_plugins/sudo.py shadows it with one that does.
become_plugins = ./become_plugins
