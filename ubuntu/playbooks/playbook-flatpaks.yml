---
# Ubuntu ships snap, not flatpak, so the runtime has to be installed first.
- name: Install the Flatpak runtime
  hosts: all
  become: true
  tasks:
    - name: Install flatpak
      ansible.builtin.apt:
        name: flatpak
        state: present

- name: Install Flatpak applications
  hosts: all
  become: true
  become_user: "{{ target_user }}"
  vars:
    flatpaks:
      - com.github.tchx84.Flatseal
      - com.obsproject.Studio
      - org.filezillaproject.Filezilla
      - com.github.jeromerobert.pdfarranger
      - de.haeckerfelix.Shortwave
      - com.anydesk.Anydesk
      - org.localsend.localsend_app
      - org.torproject.torbrowser-launcher
      - io.github.getnf.embellish
      - io.github.ronniedroid.concessio
      - re.sonny.Eloquent
      # A dnf package on Fedora; Ubuntu has no deb, flatpak is the
      # officially supported install there.
      - com.usebottles.bottles

  tasks:
    - name: Add Flathub remote for user
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: user

    - name: Install Flatpak applications for user
      community.general.flatpak:
        name: "{{ item }}"
        state: present
        remote: flathub
        method: user
      loop: "{{ flatpaks }}"
