---
- name: Install agent CLI installer dependencies
  hosts: all
  become: true

  tasks:
    - name: Install dependencies for agent CLI installers
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - unzip
          - git
        state: present

- name: Install agent CLIs
  hosts: all
  become: false

  tasks:
    - name: Install Claude Code
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: "{{ target_user_home }}/.local/bin/claude"
      # noqa: command-instead-of-module

    - name: Install Mistral Vibe CLI
      ansible.builtin.shell: |
        set -o pipefail
        curl -LsSf https://mistral.ai/vibe/install.sh | bash
      args:
        creates: "{{ target_user_home }}/.local/bin/vibe"
      # noqa: command-instead-of-module

    - name: Install Codex
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://chatgpt.com/codex/install.sh | sh
      args:
        creates: "{{ target_user_home }}/.local/bin/codex"
      # noqa: command-instead-of-module

    - name: Configure shell PATH for agent CLIs
      ansible.builtin.blockinfile:
        path: "{{ target_user_home }}/{{ item }}"
        block: |
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - agent clis"
        create: true
        mode: "0644"
      loop:
        - .bashrc
        - .zshrc

# Restores the Claude Code configuration (skills, hooks, agents, keybindings,
# a redacted settings.json and the plugin manifest) from a backup repository,
# then arms the session-end hook so later sessions back themselves up.
- name: Set up Claude Code configuration sync
  hosts: all
  become: true
  become_user: "{{ target_user }}"

  vars:
    claude_sync_bin: "{{ target_user_home }}/.local/bin/claude-sync"

  environment:
    # uv, claude-sync and claude all install here, and this play runs before
    # the shell profile that would otherwise put it on PATH.
    PATH: "{{ target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"

  tasks:
    - name: Set up Claude Code settings sync
      when: claude_sync.backup_repo | length > 0
      block:

        - name: Authenticate git against GitHub for private repositories
          # claude-sync shells out to plain `git clone` and `git push` with no
          # credential handling of its own, so the token has to reach git some
          # other way. The credential store keeps it in one 0600 file instead
          # of embedded in every remote URL.
          when: github_token | length > 0
          block:

            - name: Write the git credential store
              ansible.builtin.copy:
                content: "https://oauth2:{{ github_token }}@github.com\n"
                dest: "{{ target_user_home }}/.git-credentials"
                mode: "0600"
              no_log: true

            - name: Enable the git credential store
              community.general.git_config:
                name: credential.helper
                scope: global
                value: store

        - name: Ensure the parent directory of the backup clone exists
          # git clone would create it, but then its owner and mode depend on
          # whatever umask the run inherits. ~/Tools is not part of a stock
          # Ubuntu home directory.
          ansible.builtin.file:
            path: "{{ claude_sync.dest | dirname }}"
            state: directory
            mode: "0755"

        - name: Install claude-code-sync as a uv tool
          # Deliberately not uvx: the session-end hook records the absolute
          # path of whichever claude-sync installed it, and an ephemeral uvx
          # environment lives in the uv cache, so `uv cache clean` would leave
          # the hook pointing at a binary that no longer exists.
          ansible.builtin.command: uv tool install claude-code-sync
          args:
            creates: "{{ claude_sync_bin }}"

        - name: Restore the Claude Code configuration from the backup
          # One-time: restore overwrites ~/.claude from the backup and saves
          # what it replaced. Re-running it on every pass would undo local
          # changes made since. `creates` ties it to the clone.
          ansible.builtin.command: >-
            {{ claude_sync_bin }} restore {{ claude_sync.backup_repo }}
            --to {{ claude_sync.dest }}
          args:
            creates: "{{ claude_sync.dest }}"
          register: claude_sync_restore

        - name: Report the restore result
          # Lists plugins that failed to reinstall and the env vars redacted
          # out of settings.json, both of which need attention by hand.
          # `creates` leaves stdout empty rather than marking the task skipped.
          ansible.builtin.debug:
            msg: "{{ claude_sync_restore.stdout_lines }}"
          when: claude_sync_restore.stdout_lines | default([]) | length > 0

        - name: Check whether the session-end backup hook is installed
          ansible.builtin.command: >-
            grep -q "claude-sync backup --quiet"
            {{ target_user_home }}/.claude/settings.json
          register: claude_sync_hook
          changed_when: false
          failed_when: false

        - name: Install the session-end backup hook
          ansible.builtin.command: "{{ claude_sync_bin }} hook install"
          changed_when: true
          when:
            - claude_sync.install_hook
            - claude_sync_hook.rc != 0
