---
- hosts: all
  become: true

  tasks:
    - name: Install Steam
      # multiverse, enabled by the starter playbook.
      apt:
        name: steam-installer
        state: present
    - name: Install Steam Devices
      apt:
        name: steam-devices
        state: present
    - name: Install Lutris
      apt:
        name: lutris
        state: present
    - name: Install MangoHud
      apt:
        name: mangohud
        state: present
    - name: Install vkBasalt
      apt:
        name: vkbasalt
        state: present
    - name: Install GameMode
      apt:
        name: gamemode
        state: present
    - name: Install goverlay
      apt:
        name: goverlay
        state: present
    - name: Enable i386 architecture for Faugus Launcher
      command: dpkg --add-architecture i386
    - name: Add Faugus Launcher PPA
      apt_repository:
        repo: ppa:faugus/faugus-launcher
    - name: Install Faugus Launcher
      apt:
        name: faugus-launcher
        state: present
        update_cache: true
    - name: Get the latest LACT release info
      uri:
        url: https://api.github.com/repos/ilya-zlobintsev/LACT/releases/latest
        return_content: true
        body_format: json
      register: lact_release
    - name: Find the LACT .deb URL for this Ubuntu version
      set_fact:
        lact_deb_url: "{{ item.browser_download_url }}"
      loop: "{{ lact_release.json.assets }}"
      when: item.name | regex_search('^lact-[0-9].*\.amd64\.ubuntu-' ~ (ansible_distribution_version | replace('.', '')) ~ '\.deb$')
    - name: Download LACT .deb
      get_url:
        url: "{{ lact_deb_url }}"
        dest: /tmp/lact.deb
        mode: "0644"
    - name: Install LACT
      apt:
        deb: /tmp/lact.deb
