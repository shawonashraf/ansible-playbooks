---
# Resolves and validates the configuration the other playbooks depend on.
# Must run first: it sets target_user_home, which later plays use for paths.
- hosts: all
  become: false

  tasks:
    - name: Check that target_user is set to something usable
      assert:
        that:
          - target_user is defined
          - target_user | length > 0
          - target_user != 'root'
        fail_msg: >-
          target_user resolved to "{{ target_user | default('') }}", which is not
          a usable account. Set it explicitly in group_vars/all/config.yml.
        success_msg: "Configuring for user: {{ target_user }}"

    - name: Look up the account of target_user
      getent:
        database: passwd
        key: "{{ target_user }}"
      register: target_user_passwd
      failed_when: false

    - name: Fail when target_user does not exist on this machine
      fail:
        msg: >-
          No account named "{{ target_user }}" exists on this machine.
          Create it first, or correct target_user in group_vars/all/config.yml.
      when: target_user not in (getent_passwd | default({}))

    - name: Resolve the home directory of target_user
      set_fact:
        target_user_home: "{{ target_user_home | default(getent_passwd[target_user][4], true) }}"

    - name: Check that the home directory exists
      stat:
        path: "{{ target_user_home }}"
      register: target_user_home_stat

    - name: Fail when the home directory is missing
      fail:
        msg: "Home directory {{ target_user_home }} for {{ target_user }} does not exist."
      when: not target_user_home_stat.stat.isdir | default(false)

    - name: Report the resolved configuration
      debug:
        msg:
          - "target_user:      {{ target_user }}"
          - "target_user_home: {{ target_user_home }}"
          - "secrets loaded:   {{ 'yes' if github_token | length > 0 else 'no (vault.yml absent or empty)' }}"
          - "private repos:    {{ private_repos | length }}"
