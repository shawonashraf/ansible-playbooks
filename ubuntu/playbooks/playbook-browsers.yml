---
- hosts: all
  become: true

  vars:
    mozilla_key_fingerprint: 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3

  pre_tasks:
    - name: Require Ubuntu
      # The Snap removal step is Ubuntu-specific; the Mozilla apt repo works
      # on any Debian-based distro, but the snap guards below assume snapd.
      assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'

  tasks:
    - name: Install Google Chrome
      # The .deb registers Google's apt repository on install, so later
      # system updates keep Chrome current.
      apt:
        deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

    - name: Ensure prerequisites for the Mozilla key are installed
      apt:
        name:
          - ca-certificates
          - gnupg
        state: present

    - name: Create APT keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Mozilla signing key over HTTPS
      get_url:
        url: https://packages.mozilla.org/apt/repo-signing-key.gpg
        dest: /etc/apt/keyrings/packages.mozilla.org.asc
        owner: root
        group: root
        mode: '0644'

    - name: Read signing key fingerprint
      command:
        argv:
          - gpg
          - --batch
          - --show-keys
          - --with-colons
          - /etc/apt/keyrings/packages.mozilla.org.asc
      register: mozilla_key
      changed_when: false
      when: not ansible_check_mode

    - name: Verify Mozilla signing key
      assert:
        that:
          - "('fpr:::::::::' ~ mozilla_key_fingerprint ~ ':') in mozilla_key.stdout"
        fail_msg: Mozilla signing key fingerprint did not match; stopping.
      when: not ansible_check_mode

    - name: Configure Mozilla Deb822 repository
      # signed_by points at the key whose fingerprint was verified above, so
      # the repo cannot be silently re-pointed at a different signing key.
      deb822_repository:
        name: mozilla
        types: deb
        uris: https://packages.mozilla.org/apt
        suites: mozilla
        components: main
        signed_by: /etc/apt/keyrings/packages.mozilla.org.asc

    - name: Remove legacy Mozilla source file from the earlier setup
      file:
        path: /etc/apt/sources.list.d/mozilla.list
        state: absent

    - name: Prefer Mozilla Firefox and block the Ubuntu Snap transition package
      # Pin-Priority 1001 lets apt downgrade from Ubuntu's higher 1: epoch to
      # the Mozilla build; -1 on the Ubuntu firefox package blocks the snap
      # transition package that would otherwise pull the snap back in.
      copy:
        dest: /etc/apt/preferences.d/mozilla
        owner: root
        group: root
        mode: '0644'
        content: |
          Package: firefox*
          Pin: origin packages.mozilla.org
          Pin-Priority: 1001

          Package: firefox
          Pin: release o=Ubuntu
          Pin-Priority: -1

    - name: Refresh APT indexes
      apt:
        update_cache: true

    - name: Install current Mozilla Firefox DEB
      # allow_downgrade handles Ubuntu's numerically higher 1: epoch so the
      # Mozilla build wins despite the pin. fail_on_autoremove keeps a failed
      # run from pulling in unrelated removals.
      apt:
        name: firefox
        state: latest
        allow_downgrade: true
        force_apt_get: true
        fail_on_autoremove: true

    - name: Check whether Snap is available
      stat:
        path: /usr/bin/snap
      register: snap_binary

    - name: List installed snaps
      command:
        argv: [/usr/bin/snap, list]
      environment:
        LC_ALL: C
      register: installed_snaps
      changed_when: false
      check_mode: false
      when: snap_binary.stat.exists

    # No --purge: keep Snap's normal automatic removal snapshot so a profile
    # rollback stays possible.
    - name: Remove Firefox Snap if installed
      command:
        argv: [/usr/bin/snap, remove, firefox]
      changed_when: true
      when:
        - snap_binary.stat.exists
        - installed_snaps.stdout is search('(?m)^firefox\s')

    - name: Show installed Firefox version and APT candidate
      command:
        argv: [apt-cache, policy, firefox]
      register: firefox_policy
      changed_when: false
      when: not ansible_check_mode

    - name: Display installation result
      debug:
        var: firefox_policy.stdout_lines
      when: not ansible_check_mode
