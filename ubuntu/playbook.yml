---
# playbook-preflight must stay first: it resolves target_user_home,
# which the devtools, agents and flatpaks playbooks depend on.
- import_playbook: playbooks/playbook-preflight.yml
# playbook-github must stay second: it creates the ssh key that devtools
# signs with, and works out whether agents and shell can clone over ssh.
- import_playbook: playbooks/playbook-github.yml
- import_playbook: playbooks/playbook-starter.yml
- import_playbook: playbooks/playbook-utils.yml
- import_playbook: playbooks/playbook-devtools.yml
# For some reason desktop icons don't show up if installed via ansible
# - import_playbook: playbooks/playbook-flatpaks.yml
- import_playbook: playbooks/playbook-media.yml
- import_playbook: playbooks/playbook-browsers.yml
- import_playbook: playbooks/playbook-messaging.yml
- import_playbook: playbooks/playbook-gaming.yml
- import_playbook: playbooks/playbook-agents.yml
# Last on purpose: it replaces ~/.zshrc, including the PATH blocks the
# devtools and agents playbooks write into it.
- import_playbook: playbooks/playbook-shell.yml
