[project]
name = "ansible-playbooks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ansible>=14.3.1",
    "ansible-lint>=26.8.0",
]

[tool.uv]
# ansible 14.x pins ansible-core ~=2.21, whose modules crash on Python 3.15
# (Fedora 45's /usr/bin/python3) because dataclasses._is_type is gone.
# 2.22 fixes that; drop this override once ansible 15 is released.
override-dependencies = ["ansible-core>=2.22.0"]
