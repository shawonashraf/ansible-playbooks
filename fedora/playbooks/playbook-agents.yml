---
- hosts: all
  become: true

  tasks:
    - name: Install dependencies for agent CLI installers
      dnf:
        name:
          - curl
          - tar
          - unzip
          - git
        state: present

- hosts: all
  become: false
  vars:
    target_user: shawon

  tasks:
    - name: Install Claude Code
      shell: |
        curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: "/home/{{ target_user }}/.local/bin/claude"

    - name: Install opencode
      shell: |
        curl -fsSL https://opencode.ai/install | bash
      args:
        creates: "/home/{{ target_user }}/.opencode/bin/opencode"

    - name: Configure shell PATH for agent CLIs
      blockinfile:
        path: "/home/{{ target_user }}/{{ item }}"
        block: |
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - agent clis"
        create: true
      loop:
        - .bashrc
        - .zshrc
