---
- hosts: all
  become: true
  tasks:
    - name: Install curl
      dnf:
        name: curl
        state: present

- hosts: all
  become: false
  vars:
    target_user: shawon

  tasks:
    - name: Install Claude Code
      shell: curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: "/home/{{ target_user }}/.local/bin/claude"

    - name: Install OpenCode
      shell: curl -fsSL https://opencode.ai/install | bash
      args:
        creates: "/home/{{ target_user }}/.local/bin/opencode"

    - name: Install Mistral Vibe CLI
      shell: curl -LsSf https://mistral.ai/vibe/install.sh | bash
      args:
        creates: "/home/{{ target_user }}/.local/bin/vibe"

    - name: Add ~/.local/bin to PATH in .bashrc
      blockinfile:
        path: "/home/{{ target_user }}/.bashrc"
        block: |
          export PATH="$HOME/.local/bin:$PATH"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - agents PATH"
        create: true

    - name: Add ~/.local/bin to PATH in .zshrc
      blockinfile:
        path: "/home/{{ target_user }}/.zshrc"
        block: |
          export PATH="$HOME/.local/bin:$PATH"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - agents PATH"
        create: true
